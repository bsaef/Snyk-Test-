<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Cat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    h1 {
      color: #e94560;
      font-size: 2rem;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #e94560aa;
    }
    canvas {
      border: 3px solid #e94560;
      border-radius: 8px;
      box-shadow: 0 0 40px #e9456055;
    }
    #hint {
      color: #aaa;
      margin-top: 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>🐱 Flappy Cat</h1>
  <canvas id="game" width="400" height="550"></canvas>
  <p id="hint">Press Space / Tap to flap!</p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const W = canvas.width;
    const H = canvas.height;

    const GRAVITY = 0.45;
    const FLAP = -8.5;
    const PIPE_W = 52;
    const PIPE_GAP = 145;
    const PIPE_SPEED = 2.6;
    const PIPE_INTERVAL = 90; // frames

    let state, cat, pipes, score, hiScore, frame, particles;

    function init() {
      state = 'waiting'; // waiting | playing | dead
      cat = { x: 90, y: H / 2, vy: 0, angle: 0 };
      pipes = [];
      score = 0;
      frame = 0;
      particles = [];
    }

    hiScore = 0;
    init();

    // ---------- Cat drawing ----------
    function drawCat(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // body
      ctx.fillStyle = '#f5a623';
      ctx.beginPath();
      ctx.ellipse(0, 4, 18, 15, 0, 0, Math.PI * 2);
      ctx.fill();

      // head
      ctx.beginPath();
      ctx.ellipse(0, -14, 14, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      // ears
      ctx.fillStyle = '#e8951a';
      // left ear
      ctx.beginPath();
      ctx.moveTo(-12, -24);
      ctx.lineTo(-18, -36);
      ctx.lineTo(-4, -28);
      ctx.closePath();
      ctx.fill();
      // right ear
      ctx.beginPath();
      ctx.moveTo(12, -24);
      ctx.lineTo(18, -36);
      ctx.lineTo(4, -28);
      ctx.closePath();
      ctx.fill();

      // inner ears
      ctx.fillStyle = '#ffb8b8';
      ctx.beginPath();
      ctx.moveTo(-11, -25);
      ctx.lineTo(-16, -33);
      ctx.lineTo(-5, -28);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(11, -25);
      ctx.lineTo(16, -33);
      ctx.lineTo(5, -28);
      ctx.closePath();
      ctx.fill();

      // eyes
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.ellipse(-5, -16, 3, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(5, -16, 3, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // eye shine
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-4, -17, 1.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(6, -17, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // nose
      ctx.fillStyle = '#e05f5f';
      ctx.beginPath();
      ctx.moveTo(0, -11);
      ctx.lineTo(-2.5, -13.5);
      ctx.lineTo(2.5, -13.5);
      ctx.closePath();
      ctx.fill();

      // whiskers
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 0.8;
      [-1, 1].forEach(side => {
        [0, 2, -2].forEach(offset => {
          ctx.beginPath();
          ctx.moveTo(side * 2, -12 + offset);
          ctx.lineTo(side * 22, -12 + offset * 1.5);
          ctx.stroke();
        });
      });

      // tail
      ctx.strokeStyle = '#e8951a';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-14, 12);
      ctx.quadraticCurveTo(-36, 24, -28, 36);
      ctx.stroke();

      // stripes
      ctx.strokeStyle = '#c47a10';
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.5;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 8 - 2, -6);
        ctx.lineTo(i * 8 + 2, 14);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    // ---------- Pipe drawing ----------
    function drawPipe(pipe) {
      const grad = ctx.createLinearGradient(pipe.x, 0, pipe.x + PIPE_W, 0);
      grad.addColorStop(0, '#2ecc71');
      grad.addColorStop(0.5, '#27ae60');
      grad.addColorStop(1, '#1a7a44');

      ctx.fillStyle = grad;

      // top pipe
      ctx.beginPath();
      ctx.roundRect(pipe.x, 0, PIPE_W, pipe.top, [0, 0, 6, 6]);
      ctx.fill();

      // top pipe cap
      ctx.fillStyle = '#27ae60';
      ctx.beginPath();
      ctx.roundRect(pipe.x - 4, pipe.top - 22, PIPE_W + 8, 22, [4, 4, 0, 0]);
      ctx.fill();

      // bottom pipe
      const botY = pipe.top + PIPE_GAP;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(pipe.x, botY, PIPE_W, H - botY, [6, 6, 0, 0]);
      ctx.fill();

      // bottom pipe cap
      ctx.fillStyle = '#27ae60';
      ctx.beginPath();
      ctx.roundRect(pipe.x - 4, botY, PIPE_W + 8, 22, [0, 0, 4, 4]);
      ctx.fill();
    }

    // ---------- Background ----------
    function drawBG() {
      // sky gradient
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#0f0c29');
      sky.addColorStop(1, '#302b63');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // stars
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      const stars = [[30,40],[80,90],[150,25],[220,65],[300,30],[350,80],[60,200],[200,180],[370,150]];
      stars.forEach(([sx, sy]) => {
        const pulse = 0.5 + 0.5 * Math.sin(frame * 0.04 + sx);
        ctx.globalAlpha = pulse * 0.8;
        ctx.beginPath();
        ctx.arc(sx, sy, 1.5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // ground
      const grd = ctx.createLinearGradient(0, H - 60, 0, H);
      grd.addColorStop(0, '#4a3728');
      grd.addColorStop(1, '#2c1810');
      ctx.fillStyle = grd;
      ctx.fillRect(0, H - 60, W, 60);

      // grass
      ctx.fillStyle = '#2d5a27';
      ctx.fillRect(0, H - 60, W, 12);
    }

    // ---------- Particles ----------
    function spawnParticles(x, y) {
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color: ['#f5a623','#e94560','#fff','#2ecc71'][Math.floor(Math.random()*4)],
          size: 3 + Math.random() * 4,
        });
      }
    }

    function updateParticles() {
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= 0.025;
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // ---------- Collision ----------
    function catHitbox() {
      return { x: cat.x - 14, y: cat.y - 26, w: 32, h: 50 };
    }

    function checkCollision(pipe) {
      const h = catHitbox();
      const inX = h.x < pipe.x + PIPE_W && h.x + h.w > pipe.x;
      const inTopPipe = h.y < pipe.top;
      const inBotPipe = h.y + h.h > pipe.top + PIPE_GAP;
      return inX && (inTopPipe || inBotPipe);
    }

    // ---------- Overlay ----------
    function drawOverlay() {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);

      if (state === 'waiting') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('Flappy Cat', W / 2, H / 2 - 40);
        ctx.font = '18px Segoe UI';
        ctx.fillStyle = '#f5a623';
        ctx.fillText('Press Space or Tap to start', W / 2, H / 2 + 10);
      }

      if (state === 'dead') {
        ctx.fillStyle = '#e94560';
        ctx.font = 'bold 36px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over!', W / 2, H / 2 - 60);

        ctx.fillStyle = '#fff';
        ctx.font = '22px Segoe UI';
        ctx.fillText('Score: ' + score, W / 2, H / 2 - 15);
        ctx.fillText('Best: ' + hiScore, W / 2, H / 2 + 20);

        ctx.fillStyle = '#f5a623';
        ctx.font = '17px Segoe UI';
        ctx.fillText('Press Space or Tap to retry', W / 2, H / 2 + 65);
      }
    }

    function drawScore() {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 32px Segoe UI';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 6;
      ctx.fillText(score, W / 2, 50);
      ctx.shadowBlur = 0;

      if (hiScore > 0) {
        ctx.fillStyle = '#f5a623';
        ctx.font = '14px Segoe UI';
        ctx.fillText('Best: ' + hiScore, W / 2, 72);
      }
    }

    // ---------- Game loop ----------
    function flap() {
      if (state === 'waiting') {
        state = 'playing';
      } else if (state === 'dead') {
        init();
        state = 'playing';
      }
      if (state === 'playing') {
        cat.vy = FLAP;
      }
    }

    document.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });
    canvas.addEventListener('click', flap);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });

    function update() {
      frame++;

      if (state !== 'playing') return;

      // Cat physics
      cat.vy += GRAVITY;
      cat.y += cat.vy;
      cat.angle = Math.max(-0.5, Math.min(Math.PI / 2, cat.vy * 0.06));

      // Spawn pipes
      if (frame % PIPE_INTERVAL === 0) {
        const top = 60 + Math.random() * (H - PIPE_GAP - 120 - 60);
        pipes.push({ x: W + 10, top, scored: false });
      }

      // Move pipes
      pipes.forEach(p => p.x -= PIPE_SPEED);
      pipes = pipes.filter(p => p.x + PIPE_W > -10);

      // Score
      pipes.forEach(p => {
        if (!p.scored && p.x + PIPE_W < cat.x) {
          p.scored = true;
          score++;
          if (score > hiScore) hiScore = score;
        }
      });

      // Collisions
      const hitGround = cat.y > H - 60 - 20;
      const hitCeiling = cat.y < 20;
      const hitPipe = pipes.some(checkCollision);

      if (hitGround || hitCeiling || hitPipe) {
        spawnParticles(cat.x, cat.y);
        state = 'dead';
      }

      updateParticles();
    }

    function render() {
      drawBG();
      pipes.forEach(drawPipe);
      drawParticles();

      if (state !== 'dead') {
        drawCat(cat.x, cat.y, cat.angle);
      }

      if (state === 'playing') drawScore();
      if (state !== 'playing') drawOverlay();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    // Draw initial cat on waiting screen
    loop();
  </script>
</body>
</html>
